name: Frontend production image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm run lint
      - run: node --test scripts/audit-production.test.mjs
      - run: npm run build
      - name: Audit dependencies with the documented build-only exception
        shell: bash
        run: |
          npm audit --json > audit.json || test "$?" -eq 1
          node scripts/audit-production.mjs audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: frontend-dependency-audit, path: audit.json}
      - name: Secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --redact --no-banner
  image:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate public build configuration
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          AUTH_DOMAIN: ${{ vars.AUTH_DOMAIN }}
        run: |
          for domain in "$APP_DOMAIN" "$API_DOMAIN" "$AUTH_DOMAIN"; do
            [[ "$domain" =~ ^[a-z0-9][a-z0-9.-]+\.[a-z]{2,}$ ]] || exit 1
          done
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tixflow-frontend" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }}
            NEXT_PUBLIC_OIDC_AUTHORITY=https://${{ vars.AUTH_DOMAIN }}/realms/tixflow
            NEXT_PUBLIC_OIDC_CLIENT_ID=tixflow-web
            NEXT_PUBLIC_OIDC_REDIRECT_URI=https://${{ vars.APP_DOMAIN }}/auth/callback
            NEXT_PUBLIC_OIDC_POST_LOGOUT_REDIRECT_URI=https://${{ vars.APP_DOMAIN }}/
      - run: echo '${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
